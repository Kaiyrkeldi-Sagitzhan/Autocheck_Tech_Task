services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - HTTP_PORT=8080
      - DB_PATH=/app/data/autocheck.db
      - IMPORT_DIR=/app/data/imports
      - IMPORT_INTERVAL=300s
      - IMPORT_CRON=*/5 * * * *
      - IMPORT_FILE=/app/data/imports/cars.csv
    volumes:
      - app-data:/app/data

  # Optional: Vite dev server for frontend development with hot reload.
  # frontend-dev:
  #   image: node:20-alpine
  #   working_dir: /web
  #   command: sh -c "npm install && npm run dev -- --host"
  #   ports:
  #     - "5173:5173"
  #   volumes:
  #     - ./web:/web

volumes:
  app-data:
